<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herdr Android renders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Colours: herdr-app settings.rs presets run through resolve(). Do not hand-edit. */
.graphite{
  --bg:#17191d; --chrome:#101114; --canvas:#131518; --popover:#25272b; --raised:#2c2e31;
  --hover:#ffffff0e; --selected:#ffffff17; --border:#ffffff18; --input:#ffffff24;
  --fg:#eeeeef; --term-fg:#d2d4d9; --muted:#98999b; --dim:#696a6d; --idle:#696a6d; --ring:#aeaeb0;
  --accent:#96b2d7; --solid:#eeeeef; --solid-fg:#111215; --selection:#394454;
  --working:#e5c07b; --blocked:#f0705f; --done:#76a8ff;
  --a0:#45484f;--a1:#dc8c95;--a2:#a6bd91;--a3:#d8be87;--a4:#96b2d7;--a5:#b5a2ce;--a6:#8cbdc3;--a7:#d2d4d9;
  --a8:#818793;--a9:#f0a5ad;--a10:#bad5a2;--a11:#ead2a1;--a12:#b0cbef;--a13:#cbb7e6;--a14:#a4d5db;--a15:#f0f0f2;
  --kb:#1b1c1f; --kb-key:#2e3034; --kb-fn:#26282b; color-scheme:dark;
}
.paper{
  --bg:#ffffff; --chrome:#f1f1ee; --canvas:#fafaf9; --popover:#ffffff; --raised:#f6f6f6;
  --hover:#0000000c; --selected:#00000012; --border:#00000017; --input:#00000026;
  --fg:#1b1b1e; --term-fg:#25272c; --muted:#69696a; --dim:#969698; --idle:#a8a8aa; --ring:#5f5f62;
  --accent:#1f62d0; --solid:#1b1b1e; --solid-fg:#ffffff; --selection:#cfdcf5;
  --working:#9a6700; --blocked:#c93c2c; --done:#2f6fe4;
  --a0:#25272c;--a1:#c62a2a;--a2:#1a7f37;--a3:#8f5d00;--a4:#1f62d0;--a5:#7a45c8;--a6:#0f6f74;--a7:#5f6068;
  --a8:#7b7e87;--a9:#d1242f;--a10:#1f883d;--a11:#9a6700;--a12:#0969da;--a13:#8250df;--a14:#1b7c83;--a15:#111214;
  --kb:#e8eaed; --kb-key:#ffffff; --kb-fn:#d3d6db; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0b0c0e}
body{font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.gallery{display:flex;flex-wrap:wrap;gap:40px;padding:40px}
.frame{display:flex;flex-direction:column;gap:12px}
.frame>h2{margin:0;font:500 13px Geist,sans-serif;color:#98999b}
body.single{padding:0}
body.single .frame>h2{display:none}
.phone{width:412px;height:915px;position:relative;overflow:hidden;background:var(--chrome);color:var(--fg);display:flex;flex-direction:column;font-size:16px}
.mono{font-family:"JetBrains Mono",monospace}
button{font-family:inherit;color:inherit}

/* Android system bars (drawn by the system, shown for context) */
.sysbar{height:36px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font-size:14px;font-weight:500;color:var(--fg)}
.sysicons{display:flex;gap:6px;align-items:center}
.sysicons i{display:block;background:currentColor;border-radius:2px}
.navbar{height:28px;flex:none;display:flex;align-items:center;justify-content:center}
.navbar span{width:108px;height:4px;border-radius:2px;background:var(--fg);opacity:.55}

/* Top bar */
.top{height:60px;flex:none;display:flex;align-items:center;padding:0 8px 0 20px;gap:4px}
.top h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em;flex:1}
.iconbtn{width:48px;height:48px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.iconbtn svg{width:22px;height:22px}
.iconbtn .badge{position:absolute;top:11px;right:11px;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--idle);background:var(--chrome)}

/* Machine notice line */
.notice{margin:0 16px 4px;height:36px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:13px;color:var(--muted);background:var(--hover)}
.ring{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--idle);flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* List */
.list{flex:1;overflow:hidden;padding:0 8px}
.sec{height:40px;padding:12px 12px 0;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500}
.sec .n{color:var(--dim)}
.sec .grow{flex:1}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:0 12px;border-radius:12px}
.row .ic{width:20px;height:20px;flex:none}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:13px;color:var(--dim);flex:none}
.row.idle .name{color:var(--muted)}
.st{flex:none;width:18px;display:flex;align-items:center;justify-content:center}
.st .spin{width:15px;height:15px;color:var(--working)}
.st .done{width:9px;height:9px;border-radius:50%;background:var(--done)}
.st .idle{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--idle)}
.bar{height:3px;border-radius:2px;background:var(--border);margin-top:4px;width:150px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--working)}
.offline{font-size:11.5px;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:1px 6px;flex:none}

/* Signature: the needs-you card */
.card{margin:4px 0 8px;border-radius:14px;background:var(--popover);border:1px solid var(--border);border-left:3px solid var(--blocked);padding:12px 14px 13px 13px;display:flex;flex-direction:column;gap:10px}
.card .head{display:flex;align-items:center;gap:12px}
.card .ask{border-radius:9px;background:var(--canvas);padding:9px 11px;display:flex;flex-direction:column;gap:3px}
.card .kind{font-size:12px;font-weight:600;color:var(--blocked);letter-spacing:.01em}
.card .msg{font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.45;color:var(--term-fg)}
.pill{height:22px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:600;display:flex;align-items:center;flex:none}
.pill.blocked{background:color-mix(in srgb,var(--blocked) 15%,transparent);color:var(--blocked)}

/* Terminal screen */
.ttop{flex:none;display:flex;align-items:center;gap:6px;height:64px;padding:0 12px 0 4px;background:var(--chrome)}
.ttop .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ttop .name{font-size:17px;font-weight:500}
.ttop .sub{font-size:13px;color:var(--dim)}
.queue{flex:none;height:34px;display:flex;align-items:center;gap:8px;padding:0 14px 0 13px;font-size:13px;border-left:3px solid var(--blocked);background:color-mix(in srgb,var(--blocked) 9%,var(--chrome));border-top:1px solid var(--border)}
.queue b{font-weight:600;color:var(--blocked)}
.queue .rest{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.queue svg{width:16px;height:16px;color:var(--muted)}
.term{font-variant-ligatures:none;flex:1;padding:6px 10px 0;box-sizing:border-box;background:var(--bg);color:var(--term-fg);font-family:"JetBrains Mono",monospace;white-space:pre;overflow:hidden;position:relative}
.term .l{display:block;height:1.25em;line-height:1.25em}
.c1{color:var(--a1)}.c2{color:var(--a2)}.c3{color:var(--a3)}.c4{color:var(--a4)}.c5{color:var(--a5)}.c6{color:var(--a6)}.c8{color:var(--a8)}.c9{color:var(--a9)}.c15{color:var(--a15)}
.bgadd{background:color-mix(in srgb,var(--a2) 16%,transparent)}.bgdel{background:color-mix(in srgb,var(--a1) 16%,transparent)}
.bold{font-weight:700}
.cursor{background:var(--term-fg);color:var(--bg)}
.chip{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;height:40px;padding:0 16px;border-radius:20px;background:var(--popover);border:1px solid var(--border);display:flex;align-items:center;gap:8px;font-family:Geist,sans-serif;font-size:13.5px;color:var(--muted);white-space:nowrap;box-shadow:0 6px 20px #0006}
.chip b{color:var(--fg);font-weight:500}
.chip svg{width:16px;height:16px}
.sizetag{position:absolute;right:8px;top:6px;font-family:Geist,sans-serif;font-size:11.5px;color:var(--dim);background:var(--canvas);border:1px solid var(--border);border-radius:6px;padding:2px 7px}

/* Keys row */
.keys{flex:none;height:48px;display:flex;gap:4px;padding:4px 6px;background:var(--chrome);border-top:1px solid var(--border)}
.key{flex:1;border-radius:8px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--fg);font-family:"JetBrains Mono",monospace}
.key.on{background:var(--solid);color:var(--solid-fg)}
.key svg{width:18px;height:18px}
.key.compose{flex:1.25;background:transparent;border:1px solid var(--input)}

/* System keyboard (drawn by Gboard, shown for context) */
.kbd{flex:none;background:var(--kb);padding:6px 4px 4px;display:flex;flex-direction:column;gap:9px}
.kbd .sugg{height:38px;display:flex;align-items:center;justify-content:space-around;color:var(--muted);font-size:15px;border-bottom:1px solid var(--border);margin:-2px 4px 2px}
.kbd .kr{display:flex;gap:5px;justify-content:center}
.kbd .k{width:35px;height:46px;border-radius:7px;background:var(--kb-key);display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--fg)}
.kbd .k.fn{background:var(--kb-fn);font-size:14px}
.kbd .k.w{width:56px}.kbd .k.sp{width:190px}

/* Sheet */
.scrim{position:absolute;inset:0;background:#00000080}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--popover);border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.handle{width:36px;height:4px;border-radius:2px;background:var(--input);margin:10px auto 6px}
.btn{height:44px;border-radius:12px;border:1px solid var(--input);background:transparent;font-size:15px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.solid{background:var(--solid);color:var(--solid-fg);border-color:var(--solid);font-weight:500}
.field{border-radius:12px;background:var(--canvas);border:1px solid var(--input);padding:12px 14px;font-size:16px;line-height:1.45;min-height:120px}

/* Lock screen */
.lock{background:radial-gradient(120% 70% at 30% 10%,#2a2f3a,#0e1013 70%)}
.clock{font-size:92px;font-weight:400;letter-spacing:-.03em;line-height:1;margin:56px 0 0 32px;color:#eef0f3}
.date{margin:10px 0 0 34px;font-size:16px;color:#c9ccd2}
.notif{margin:0 12px;background:#24262bf2;border-radius:24px;padding:16px 18px;color:#eef0f3;display:flex;flex-direction:column;gap:4px}
.notif .meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#a9adb5}
.notif .meta img{width:18px;height:18px;border-radius:5px}
.notif .t{font-size:16px;font-weight:500}
.notif .b{font-size:14.5px;color:#c4c7cd}

/* Settings-like lists */
.mcard{margin:0 16px 14px;border-radius:16px;background:var(--popover);border:1px solid var(--border);overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 16px 12px}
.mhead .txt{flex:1;display:flex;flex-direction:column;gap:3px}
.mhead .name{font-size:17px;font-weight:500}
.mhead .sub{font-size:13px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border);font-size:14.5px}
.mrow .lab{flex:1;display:flex;flex-direction:column;gap:2px}
.mrow .lab small{font-size:12.5px;color:var(--dim)}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--input);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted)}
.caption{margin:6px 32px 8px;font-size:12.5px;font-weight:500;color:var(--dim)}
.warn{color:var(--working)}
.dialog{position:absolute;left:20px;right:20px;top:200px;background:var(--popover);border-radius:24px;padding:24px 22px 18px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--border)}
.dialog h3{margin:0;font-size:21px;font-weight:600}
.dialog p{margin:0;font-size:15px;line-height:1.5;color:var(--muted)}
/* New sheet (start-agents) */
.iconbtn.off{opacity:.38}
.snack{position:absolute;left:16px;right:16px;bottom:44px;height:48px;border-radius:12px;background:var(--solid);color:var(--solid-fg);display:flex;align-items:center;padding:0 16px;font-size:14.5px}
.chips{display:flex;gap:8px;padding:0 20px 4px}
.mchip{height:36px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14.5px}
.mchip.on{background:var(--selected);border-color:var(--ring)}
.cap{padding:14px 20px 6px;font-size:12.5px;font-weight:500;color:var(--dim)}
.place{display:flex;align-items:center;gap:12px;min-height:56px;margin:0 8px;padding:0 12px;border-radius:12px}
.place.on{background:var(--selected)}
.place .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.place .name{font-size:16px}
.place .sub{font-size:13px;color:var(--dim);font-family:"JetBrains Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--input);flex:none}
.place.on .radio{border:5px solid var(--fg)}
.where{margin:8px 16px 0;border-radius:12px;background:var(--canvas);border:1px solid var(--border);padding:10px 14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.where b{color:var(--fg);font-weight:500}
.where .mono{font-size:12.5px;color:var(--term-fg)}
.starts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 16px}
.tile{height:64px;border-radius:12px;border:1px solid var(--input);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13.5px}
.tile img,.tile svg{width:20px;height:20px}
.tile.shellbtn{grid-column:1/-1;flex-direction:row;height:48px;gap:10px;font-size:15px;font-weight:500;background:var(--solid);color:var(--solid-fg);border-color:var(--solid)}
.tile.ghost{border-style:dashed;color:var(--dim)}
.agentsnote{grid-column:1/-1;font-size:13px;color:var(--dim);padding:2px 2px 0}
.err{margin:10px 16px 0;border-radius:10px;border-left:3px solid var(--blocked);background:color-mix(in srgb,var(--blocked) 9%,var(--popover));padding:9px 12px;font-size:13.5px;line-height:1.4}
.fp{font-family:"JetBrains Mono",monospace;font-size:13.5px;line-height:1.6;background:var(--canvas);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--fg);word-break:break-all}
/* Changes view (changes-view, 2026-11) */
.vswitch{height:34px;padding:0 12px;border-radius:10px;background:var(--raised);display:flex;align-items:center;font-size:12.5px;font-weight:600;flex:none}
.gauge{font-size:13px;color:var(--dim);flex:none;padding:0 4px}
.chg{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.chg svg{width:21px;height:21px}
.chg.hint{outline:1.5px dashed var(--accent);outline-offset:-3px}
.ctop{flex:none;display:flex;align-items:center;gap:6px;height:64px;padding:0 16px 0 4px;background:var(--chrome)}
.ctop .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ctop .name{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctop .sub{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbody{flex:1;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.frow{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 20px;border-bottom:1px solid var(--border)}
.frow .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.frow .file{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .dir{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .dir .w{color:var(--muted)}
.frow .w.new,.frow .w.added{color:var(--a2)}.frow .w.deleted,.frow .w.conflict{color:var(--a1)}
.frow.flat .file{color:var(--muted)}
.cnt{font-family:"JetBrains Mono",monospace;font-size:13px;display:flex;gap:7px;flex:none}
.cnt .p{color:var(--a2)}.cnt .m{color:var(--a1)}.cnt .n{color:var(--dim)}
.cnote{padding:14px 20px;font-size:13px;color:var(--dim)}
.diff{font-family:"JetBrains Mono",monospace;font-variant-ligatures:none;font-size:12.2px;line-height:1.45;color:var(--term-fg);padding:6px 0 0}
.dl{display:flex;padding:0 10px 0 0;white-space:pre;min-height:1.45em}
.dl .g{width:22px;flex:none;text-align:center;color:var(--dim)}
.dl.add{background:color-mix(in srgb,var(--a2) 16%,transparent)}.dl.add .g{color:var(--a2)}
.dl.del{background:color-mix(in srgb,var(--a1) 16%,transparent)}.dl.del .g{color:var(--a1)}
.dl .wrap{color:var(--dim)}
.hunk{margin:10px 0 4px;padding:3px 10px 3px 22px;background:var(--canvas);border-top:1px solid var(--border);border-bottom:1px solid var(--border);color:var(--dim);font-family:"JetBrains Mono",monospace;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnote{padding:3px 10px 3px 22px;color:var(--dim);font-family:Geist,sans-serif;font-size:12.5px;font-style:italic}
.cr{font-family:Geist,sans-serif;font-size:9.5px;font-weight:600;color:var(--dim);border:1px solid var(--input);border-radius:4px;padding:0 3px;margin-left:4px;vertical-align:1px}
.more{font-family:Geist,sans-serif;margin:14px 16px 10px;height:44px;border-radius:12px;border:1px solid var(--input);display:flex;align-items:center;justify-content:center;font-size:14.5px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 40px;text-align:center}
.empty .t{font-size:17px;font-weight:500}
.empty .s{font-size:14px;color:var(--muted);line-height:1.45}
/* spaces-navigation (2026-11, task 4.1): Spaces view, tab map, the quieter title bar, tab overview */
.hswitch{display:flex;align-items:baseline;gap:18px}
.hswitch span{color:var(--dim)}
.hswitch span.on{color:var(--fg)}
.hswitch b{font-size:13px;font-weight:500;color:var(--blocked);margin-left:6px;letter-spacing:0}
.tmap{position:relative;display:block;flex:none}
.tmap i{position:absolute;box-sizing:border-box;border:1px solid var(--border);border-radius:2px}
.tmap i.blocked{background:var(--blocked);border-color:var(--blocked)}
.tmap i.done{background:var(--done);border-color:var(--done)}
.tmap i.working{border-color:var(--working)}
.tmap i.ph{border-style:dashed}
.tmap i.mark{background:var(--fg);border-color:var(--fg)}
.shdr{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 12px 0;font-size:16px;font-weight:500}
.shdr .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .blocked{width:9px;height:9px;border-radius:50%;background:var(--blocked)}
.tline{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;font-size:13px;color:var(--muted);border-radius:12px}
.orow-ic{width:20px;height:20px;flex:none;color:var(--muted)}
.orow-ic svg{width:20px;height:20px;display:block}
.qbar{flex:none;display:flex;align-items:center;min-height:64px;padding:6px 4px;background:var(--chrome);color:var(--fg);font-size:calc(16px * var(--fs,1))}
.qbar .qmark{width:20px;height:20px;margin:0 12px 0 6px;flex:none}
.qbar .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.qbar .name{font-size:calc(17px * var(--fs,1));font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .sub{font-size:calc(13px * var(--fs,1));color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar .qgauge{font-size:calc(13px * var(--fs,1));color:var(--dim);flex:none;padding:8px 6px;margin-left:6px}
.qbtn{width:48px;height:48px;flex:none;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:0}
.qbtn svg{width:22px;height:22px}
.qbtn.open{background:var(--selected);color:var(--fg)}
.qbar .qbtn.map{margin-left:6px}
.qmenu{position:absolute;right:8px;top:62px;min-width:184px;background:var(--popover);border:1px solid var(--border);border-radius:12px;box-shadow:0 6px 20px #00000066;padding:4px 0;z-index:2}
.qitem{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;font-size:calc(16px * var(--fs,1));color:var(--fg)}
.qitem svg{width:20px;height:20px;color:var(--muted);flex:none}
.board{display:grid;grid-template-columns:412px 412px;gap:28px 40px;padding:32px;background:#0b0c0e;width:max-content}
.board .cell{display:flex;flex-direction:column;gap:8px}
.board .lab{font:500 12.5px Geist,sans-serif;color:#98999b}
.board .strip{position:relative;overflow:hidden;border-radius:4px}
.board .wide{grid-column:1/-1}
.icset{display:flex;gap:24px;align-items:center;padding:16px 20px;background:var(--chrome);color:var(--muted);border-radius:4px}
.icset span{display:flex;flex-direction:column;align-items:center;gap:8px;font:500 12px Geist,sans-serif;color:var(--dim)}
.icset .big svg{width:48px;height:48px}
.icset .small svg{width:22px;height:22px}
.otabs{display:flex;gap:8px;padding:8px 16px 12px;flex:none}
.otab{min-height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:12px;border:1px solid var(--input);font-size:14.5px;color:var(--muted)}
.otab.on{background:var(--selected);border-color:var(--ring);color:var(--fg)}
.otiles{position:relative;margin:4px 16px 0;flex:none}
.otile{position:absolute;box-sizing:border-box;background:var(--popover);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}
.otile .ohead{display:flex;align-items:center;justify-content:space-between}
.otile .ohead img{width:20px;height:20px}
.otile .nm{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otile.ph{background:transparent;border:1px dashed var(--input);align-items:center;justify-content:center;color:var(--dim);font-size:13px}
.omap{margin:4px 16px 8px;padding:12px;border-radius:12px;background:var(--canvas);border:1px solid var(--border);flex:none}
/* First-run sign-off drafts; reuse the existing chrome, fields, buttons and dialog. */
.fr-set{display:flex;align-items:flex-start;gap:24px;flex-wrap:wrap}
.fr-variant{display:flex;flex-direction:column;gap:10px}
.fr-label{font-size:13px;font-weight:500;color:#98999b}
.fr-body{flex:1;min-height:0;overflow:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px}
.fr-body h2{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.fr-body p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.fr-step{font-size:13px;color:var(--muted)}
.fr-footer{padding:12px 20px 8px;display:flex;flex-direction:column;gap:8px;flex:none}
.fr-link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;min-height:44px;display:flex;align-items:center;justify-content:center}
.fr-field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.fr-field .field{min-height:0;color:var(--fg)}
.fr-field small{font-size:13px;line-height:1.45}
.fr-fields{display:flex;flex-direction:column;gap:14px}
.fr-notice{padding:14px;border:1px solid var(--border);background:var(--canvas);border-radius:12px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.fr-notice p{font-size:14px}
.fr-steps{display:flex;flex-direction:column;gap:18px}
.fr-steps b{display:block;font-size:16px;font-weight:500;margin-bottom:4px}
.fr-actions{display:flex;gap:10px}
.fr-actions>.btn{flex:1;padding:0 10px}
.fr-choices{display:flex;gap:10px}
.fr-choice{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.fr-choice .btn{height:auto;min-height:52px;white-space:normal;padding:8px 10px;font-size:14px;text-align:center}
.fr-choice p{font-size:13px}
.fr-command{white-space:pre;word-break:normal;overflow-wrap:normal;margin:0;max-height:260px;overflow:auto;flex:none}
.fr-home-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 32px;text-align:center}
.fr-home-empty h2{font-size:20px;font-weight:600;margin:0}
.fr-home-empty p{font-size:14px;color:var(--muted);line-height:1.5;margin:0}
</style>
</head>
<body>
<script>
// ---------- icons (herdr-app icons; claude/codex from defaults/icons) ----------
const ico = {
  claude: '<img class="ic" src="icons/claude.svg" alt="">',
  codex: '<img class="ic" src="icons/codex.svg" alt="">',
  spin: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.4" stroke-opacity="0.24"/><path d="M12 2.6a9.4 9.4 0 0 1 9.4 9.4"/></svg>',
  server: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="7" rx="2"/><rect x="3.5" y="13" width="17" height="7" rx="2"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  kb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>',
  mic: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  shell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8"/></svg>',
  l:'←', d:'↓', u:'↑', r:'→',
};
const sysbar = (t='14:07') => `<div class="sysbar"><span>${t}</span><span class="sysicons"><i style="width:15px;height:11px;clip-path:polygon(0 100%,100% 0,100% 100%)"></i><i style="width:15px;height:11px;border-radius:50% 50% 0 0/100% 100% 0 0;clip-path:polygon(50% 100%,0 0,100% 0)"></i><i style="width:22px;height:11px;border-radius:3px"></i></span></div>`;
const navbar = () => `<div class="navbar"><span></span></div>`;
const st = s => `<span class="st">${s==='working'?ico.spin:`<span class="${s}"></span>`}</span>`;

// ---------- agent data (invented names; no client or real project names) ----------
const row = (a) => `
  <div class="row ${a.s}">
    ${ico[a.p]}
    <div class="txt">
      <span class="name">${a.n}</span>
      <span class="sub">${a.space} · ${a.m}</span>
      ${a.pr!=null?`<div class="bar"><i style="width:${a.pr}%"></i></div>`:''}
    </div>
    ${a.off?'<span class="offline">offline</span>':''}
    ${a.asof?`<span class="offline">${a.asof}</span>`:''}
    <span class="when">${a.w}</span>
    ${st(a.s)}
  </div>`;
const card = (a) => `
  <div class="card">
    <div class="head">
      ${ico[a.p]}
      <div class="txt" style="flex:1;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:16px">${a.n}</span>
        <span style="font-size:13px;color:var(--dim)">${a.space} · ${a.m}</span>
      </div>
      <span style="font-size:13px;color:var(--dim)">${a.w}</span>
    </div>
    <div class="ask"><span class="kind">${a.kind}</span><span class="msg">${a.msg}</span></div>
  </div>`;
const sec = (label, color, n, extra='') => `<div class="sec"><span style="color:var(--${color})">${label}</span><span class="n">${n}</span><span class="grow"></span>${extra}</div>`;

const agentsTop = (off=false) => `<div class="top"><h1>Agents</h1>
      <button class="iconbtn${off?' off':''}" aria-label="New terminal">${ico.plus}</button>
      <button class="iconbtn" aria-label="Machines">${ico.server}<span class="badge"></span></button>
    </div>`;
function home(theme){
  return `<div class="phone ${theme}">
    ${sysbar()}
    ${agentsTop()}
    <div class="notice"><span class="ring"></span><span style="flex:1"><span style="color:var(--fg)">server</span> unreachable · last connected 2h ago</span>${ico.right}</div>
    <div class="list">
      ${sec('Needs you','blocked',2)}
      ${card({p:'claude',n:'docs nav',space:'website',m:'workstation',w:'<1m',kind:'Permission',msg:'Bash: git push origin main'})}
      ${card({p:'codex',n:'api tests',space:'api',m:'workstation',w:'3m',kind:'Question',msg:'Which test runner should I use?'})}
      ${sec('Done','done',1)}
      ${row({p:'codex',n:'og tags',space:'website',m:'workstation',w:'4m',s:'done'})}
      ${sec('Working','working',3)}
      ${row({p:'claude',n:'pricing page',space:'website',m:'workstation',w:'<1m',s:'working',pr:40})}
      ${row({p:'claude',n:'rate limits',space:'api',m:'workstation',w:'6m',s:'working'})}
      ${row({p:'codex',n:'changelog',space:'docs',m:'workstation',w:'9m',s:'working'})}
      ${sec('Idle','dim',2)}
      ${row({p:'claude',n:'readme',space:'docs',m:'workstation',w:'12m',s:'idle'})}
      ${row({p:'claude',n:'backup notes',space:'infra',m:'server',w:'2h',s:'idle',off:true})}
      ${sec('Other terminals','dim',3,`<span style="color:var(--dim)">${ico.right}</span>`)}
    </div>
    ${navbar()}
  </div>`;
}

// ---------- terminal content ----------
function termLines(cols){
  const pad=(s,n)=>s+' '.repeat(Math.max(0,n-[...s].length));
  const box=(lines)=>{const w=cols-2;return [`<span class="c4">╭${'─'.repeat(w)}╮</span>`,...lines.map(([t,cls])=>`<span class="c4">│</span>${cls?`<span class="${cls}">`:''}${pad(t,w)}${cls?'</span>':''}<span class="c4">│</span>`),`<span class="c4">╰${'─'.repeat(w)}╯</span>`];};
  const wide = cols>70;
  const H=[
    ...(wide?[`<span class="c8">&gt;</span> fix the docs nav so the current page is marked, then push`]
        :[`<span class="c8">&gt;</span> fix the docs nav so the current page is marked,`,`  then push`]),
    ``,
    `<span class="c15 bold">●</span> Search<span class="c8">(pattern: "docs-nav", path: "src")</span>`,
    `  <span class="c8">⎿  Found 3 files</span>`,
    ``,
    `<span class="c15 bold">●</span> Read<span class="c8">(src/layouts/Docs.astro)</span>`,
    `  <span class="c8">⎿  Read 57 lines</span>`,
    ``,
    ...(wide?[`<span class="c15 bold">●</span> The nav gets <span class="c6">active</span> from the layout but never uses it.`]
        :[`<span class="c15 bold">●</span> The nav gets <span class="c6">active</span> from the layout but never uses`,`  it.`]),
    ``,
  ];
  const L=[
    ...H,
    `<span class="c15 bold">●</span> Read<span class="c8">(src/components/DocsNav.astro)</span>`,
    `  <span class="c8">⎿  Read 84 lines</span>`,
    ``,
    `<span class="c15 bold">●</span> Update<span class="c8">(src/components/DocsNav.astro)</span>`,
    `  <span class="c8">⎿  Updated with 2 additions and 1 removal</span>`,
    `<span class="c8">      41</span>    &lt;nav class="docs-nav"&gt;`,
    `<span class="bgdel"><span class="c8">      42</span> <span class="c1">-</span>    &lt;a href="/guide"&gt;Guide&lt;/a&gt;${' '.repeat(Math.max(0,cols-40))}</span>`,
    wide?`<span class="bgadd"><span class="c8">      42</span> <span class="c2">+</span>    &lt;a href="/guide" aria-current={active === "guide"}&gt;Guide&lt;/a&gt;${' '.repeat(Math.max(0,cols-74))}</span>`
        :`<span class="bgadd"><span class="c8">      42</span> <span class="c2">+</span>    &lt;a href="/guide"${' '.repeat(Math.max(0,cols-30))}</span>`,
    ...(wide?[]:[`<span class="bgadd"><span class="c8">      43</span> <span class="c2">+</span>      aria-current={active === "guide"}&gt;${' '.repeat(Math.max(0,cols-50))}</span>`]),
    `<span class="c8">      43</span>    &lt;a href="/api"&gt;API&lt;/a&gt;`,
    ``,
    `<span class="c15 bold">●</span> Active link now has aria-current. Build passes.`,
    ``,
    `<span class="c15 bold">●</span> Bash<span class="c8">(git push origin main)</span>`,
    ...box([
      [' Bash command','bold'],
      [''],
      ['   git push origin main'],
      ['   Push the docs nav fix','c8'],
      [''],
      [' Do you want to proceed?'],
      [' ❯ 1. Yes','c4'],
      ['   2. Yes, and don\'t ask again for git push'],
      ['   3. No, and tell Claude what to do differently'],
    ]),
  ];
  return L;
}
function terminal(cols, font, rows=0){
  let lines = termLines(cols);
  if (rows) { while (lines.length < rows) lines.push(''); lines = lines.slice(-rows); }
  const body = lines.map(l=>`<span class="l">${l||' '}</span>`).join('');
  // rows: draw exactly the desk's grid; the space below it is not terminal.
  return rows
    ? `<div class="term" style="font-size:${font}px;flex:none;height:calc(${rows*1.25}em + 6px)">${body}</div><div style="flex:1;background:var(--canvas);border-top:1px dashed var(--border)"></div>`
    : `<div class="term" style="font-size:${font}px;padding-top:6px">${body}</div>`;
}
const ttop = (status='blocked') => `
  <div class="ttop">
    <button class="iconbtn" aria-label="Back" style="color:var(--fg)">${ico.back}</button>
    <img src="icons/claude.svg" style="width:20px;height:20px;margin-right:6px" alt="">
    <div class="txt"><span class="name">docs nav</span><span class="sub">website · workstation</span></div>
  </div>
  <div class="queue"><b>1 more needs you</b><span class="rest">· next: api tests, question</span>${ico.up}</div>`;

function watch(){
  // Desk terminal 96x44 inside the Mac's terminal padding (10 px sides, 6 px top), fitted: 392 / (96 * 0.6) ≈ 6.8 px.
  return `<div class="phone graphite">
    ${sysbar()}
    ${ttop()}
    <div style="flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg)">
      ${terminal(96, 6.8, 44)}
      <div class="chip">${ico.eye}<span><b>Watching</b> at desk size 96×44 · tap to type</span></div>
    </div>
    ${navbar()}
  </div>`;
}
const keyboard = (sugg=false) => `<div class="kbd">
  ${sugg?`<div class="sugg"><span>summary</span><span style="color:var(--fg)">summary of</span><span>summarise</span>${ico.mic}</div>`:''}
  <div class="kr">${'qwertyuiop'.split('').map(c=>`<span class="k">${c}</span>`).join('')}</div>
  <div class="kr">${'asdfghjkl'.split('').map(c=>`<span class="k">${c}</span>`).join('')}</div>
  <div class="kr"><span class="k fn w">⇧</span>${'zxcvbnm'.split('').map(c=>`<span class="k">${c}</span>`).join('')}<span class="k fn w">⌫</span></div>
  <div class="kr"><span class="k fn w">?123</span><span class="k fn">,</span><span class="k sp"></span><span class="k fn">.</span><span class="k fn w">↵</span></div>
  ${navbar()}
</div>`;
const keysrow = () => `<div class="keys">
  <span class="key">esc</span><span class="key">tab</span><span class="key on">ctrl</span><span class="key">alt</span>
  <span class="key">${ico.l}</span><span class="key">${ico.d}</span><span class="key">${ico.u}</span><span class="key">${ico.r}</span>
  <span class="key compose" aria-label="Compose">${ico.pen}</span>
</div>`;
function typing(){
  // Phone size: 12.2 px JetBrains Mono, 0.6 em advance (7.32 px) → 53 columns in 412 px less the Mac's 10 px side padding.
  return `<div class="phone graphite">
    ${sysbar()}
    ${ttop()}
    <div style="flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden">
      <div style="position:absolute;inset:auto 0 0 0">${terminal(53, 12.2)}</div>
      <span class="sizetag">phone size 53×31</span>
    </div>
    ${keysrow()}
    ${keyboard(false)}
  </div>`;
}
function typingHidden(){
  // Keyboard hidden while typing: the phone grid grows to the full height (53x45), keys row stays.
  return `<div class="phone graphite">
    ${sysbar()}
    ${ttop()}
    <div style="flex:1;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden">
      <div style="position:absolute;inset:auto 0 0 0">${terminal(53, 12.2)}</div>
      <span class="sizetag">phone size 53×45</span>
    </div>
    ${keysrow()}
    ${navbar()}
  </div>`;
}
function compose(){
  return `<div class="phone graphite">
    ${sysbar()}
    ${ttop()}
    <div style="flex:1;position:relative;background:var(--bg);overflow:hidden">${terminal(53,12.2)}</div>
    <div class="scrim"></div>
    <div class="sheet">
      <div class="handle"></div>
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:4px 20px 10px">
        <span style="font-size:18px;font-weight:600">Compose</span>
        <span style="font-size:13px;color:var(--dim)">to docs nav</span>
      </div>
      <div style="padding:0 16px"><div class="field">Push it, then open a PR against main with a short summary of<span style="border-right:2px solid var(--accent);margin-left:1px"></span></div></div>
      <div style="display:flex;align-items:center;gap:10px;padding:12px 16px 12px 20px">
        <span style="flex:1;font-size:13px;color:var(--dim)">Pasted into the terminal. Enter is yours.</span>
        <button class="btn">Cancel</button><button class="btn solid">Paste</button>
      </div>
      ${keyboard(true)}
    </div>
  </div>`;
}
function lockscreen(){
  return `<div class="phone graphite lock">
    ${sysbar()}
    <div class="clock">14:07</div>
    <div class="date">Saturday 31 October</div>
    <div style="flex:1"></div>
    <div class="notif">
      <div class="meta"><img src="icons/herdr.svg" alt=""><span>Herdr · Needs you · now</span></div>
      <span class="t">docs nav needs you</span>
      <span class="b">Permission · workstation</span>
    </div>
    <div class="notif" style="margin-top:3px;border-radius:8px 8px 24px 24px;background:#24262bcc">
      <div class="meta"><img src="icons/herdr.svg" alt=""><span>Herdr · Finished · 4m</span></div>
      <span class="b" style="color:#eef0f3">og tags finished · workstation</span>
    </div>
    <div style="height:150px"></div>
    ${navbar()}
  </div>`;
}
function machines(){
  return `<div class="phone graphite">
    ${sysbar()}
    <div class="top" style="padding-left:4px"><button class="iconbtn" style="color:var(--fg)">${ico.back}</button><h1 style="font-size:20px">Machines</h1></div>
    <div class="mcard">
      <div class="mhead"><span class="dot" style="background:var(--a2);align-self:flex-start;margin-top:9px"></span>
        <div class="txt"><span class="name">workstation</span><span class="sub">Connected · herdr-core 0.1.16 · <span class="warn">untested version</span></span></div></div>
      <div class="mrow"><div class="lab">Alerts<small>Last accepted by ntfy 14:02 · last push here 14:02</small></div></div>
      <div class="mrow"><div class="lab">Mute alerts<small>Agents still go to the top of the list</small></div><span class="toggle"></span></div>
      <div class="mrow"><div class="lab">Send test alert<small>Test received 13:58</small></div><button class="btn" style="height:38px;font-size:14px">Send</button></div>
    </div>
    <div class="mcard">
      <div class="mhead"><span class="ring" style="align-self:flex-start;margin-top:9px"></span>
        <div class="txt"><span class="name">server</span><span class="sub">Unreachable · last connected 2h ago · retrying in 30 s</span></div></div>
      <div class="mrow"><div class="lab">Alerts<small>Last push here 11:41</small></div></div>
    </div>
    <div style="padding:2px 16px 0"><button class="btn" style="width:100%">Add machine</button></div>

    const pos = `left:${x*W+g/2}px;top:${y*H+g/2}px;width:${w*W-g}px;height:${h*H-g}px`;
    if (t.ph) return `<div class="otile ph" style="${pos}">Desk only</div>`;
    return `<div class="otile" style="${pos}"><div class="ohead">${t.p==='shell'?`<span class="orow-ic">${ico.shell}</span>`:`<img src="icons/${t.p}.svg" alt="">`}${t.s?st(t.s):'<span class="st"></span>'}</div><span class="nm">${t.n}</span></div>`;
  }).join('')}</div>`;
}
function tabOverview(){
  const tiles = `<div class="phone graphite">
    ${sysbar()}
    ${ctop('website','workstation')}
    ${otabs('main')}
    ${otiles(380, 520, [
      [0,0,.5,1,{p:'claude',n:'Pricing page copy',s:'blocked'}],
      [.5,0,.5,1/3,{p:'codex',n:'og tags',s:'working'}],
      [.5,1/3,.5,1/3,{p:'shell',n:'zsh'}],
      [.5,2/3,.5,1/3,{ph:true}],
    ])}
    <div style="flex:1"></div>
    ${navbar()}
  </div>`;
  const rows = `<div class="phone graphite">
    ${sysbar()}
    ${ctop('website','workstation')}
    ${otabs('build')}
    <div class="omap">${tmap(BUILD, 354, 72)}</div>
    <div class="list">
      ${row({p:'claude',n:'build fixes',space:'website / build',m:'workstation',w:'1m',s:'working'})}
      ${orow({n:'npm run dev',space:'website / build',m:'workstation'})}
      ${orow({n:'npm test',space:'website / build',m:'workstation'})}
      ${row({p:'codex',n:'flaky test',space:'website / build',m:'workstation',w:'5m',s:'done'})}
      ${orow({n:'htop',space:'website / build',m:'workstation'})}
      ${orow({n:'zsh',space:'website / build',m:'workstation'})}
    </div>
    ${navbar()}
  </div>`;
  return `<div style="display:flex;gap:40px">${tiles}${rows}</div>`;
// ---------- first-run-walkthrough: drafts for owner sign-off ----------
const frCommand = "(\n  umask 077\n  mkdir -p ~/.ssh && chmod 700 ~/.ssh &&\n  touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys &&\n  cat >> ~/.ssh/authorized_keys <<'KUDDE_KEY' &&\n\nrestrict,command=\"sh -c '…'\" ecdsa-sha2-nistp256 AAAA… kudde\nKUDDE_KEY\n  ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub\n)";
const frEscape = text => text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const frTop = () => `<div class="top" style="padding-left:4px"><button class="iconbtn" style="color:var(--fg)" aria-label="Back">${ico.back}</button><h1 style="font-size:20px">Set up a machine</h1></div>`;
const frGuide = () => `<a class="fr-link" href="../../README.md#setting-up">Setup guide</a>`;
const frButton = (text, solid=true) => `<button class="btn${solid?' solid':''}">${text}</button>`;
const frPhone = (theme,body,footer='',top=frTop()) => `<div class="phone ${theme}">${sysbar()}${top}${body}${footer?`<div class="fr-footer">${footer}</div>`:''}${navbar()}</div>`;
const frBody = (n,title,body) => `<div class="fr-body">${n?`<div class="fr-step">Step ${n} of 4</div>`:''}<h2>${title}</h2>${body}</div>`;
const frBoth = variants => `<div class="fr-set">${variants.flatMap(([label,fn])=>['graphite','paper'].map(theme=>`<div class="fr-variant"><div class="fr-label">${label} · ${theme}</div>${fn(theme)}</div>`)).join('')}</div>`;
const frChoices = (descriptions=false) => `<div class="fr-choices">
  <div class="fr-choice">${frButton('kudde adds it for you',false)}${descriptions?`<p>kudde signs in once as dev with that account's password, adds the same key and signs out. The password is not stored.</p>`:''}</div>
  <div class="fr-choice">${frButton('Add it yourself',false)}${descriptions?`<p>Run one command at the machine. kudde never sees a password.</p>`:''}</div>
</div>`;
function frWelcome(theme){
  return frPhone(theme,`<div class="fr-body" style="padding-top:28px;gap:22px">
    <img src="../brand/kudde-tag-A1.svg" alt="kudde" width="64" height="64">
    <h2>Set up your first machine</h2>
    <p>See which agents need you, read their work and reply on your own machines.</p>
    <div style="font-size:16px;font-weight:500">Set up in four steps</div>
    <div class="fr-steps">
      <div><b>1 · Find your machine</b><p>Linux or WSL running herdr-core and OpenSSH, on the same Wi-Fi or VPN as your phone.</p></div>
      <div><b>2 · Add this phone's key</b><p>kudde uses your password once, or you run one command yourself.</p></div>
      <div><b>3 · Connect</b><p>kudde checks the machine and shows how many agents run there.</p></div>
      <div><b>4 · Turn on alerts (optional)</b><p>Hear when an agent needs you, also with kudde closed.</p></div>
    </div>
  </div>`,frButton('Set up a machine')+frGuide(),'');
}
function frLock(theme){
  return frPhone(theme,frBody(0,'Set a screen lock first',`<p>kudde keeps its SSH key in the phone's secure hardware. Android allows that only on a phone with a PIN, pattern or password.</p>`),frButton('Set a screen lock'));
}
function frLockHome(theme){
  return frPhone(theme,`<div class="mcard" style="padding:16px;display:flex;flex-direction:column;gap:14px"><h2 style="font-size:20px;margin:0">Set a screen lock first</h2><p style="font-size:14px;line-height:1.5;color:var(--muted);margin:0">kudde keeps its SSH key in the phone's secure hardware. Android allows that only on a phone with a PIN, pattern or password.</p>${frButton('Set a screen lock')}</div><div style="flex:1"></div>`,'',agentsTop(true));
}
const frField = (label,value,help='') => `<div class="fr-field"><span>${label}</span><div class="field">${value}</div>${help?`<small>${help}</small>`:''}</div>`;
function frAddress(theme,failed=false){
  return frPhone(theme,frBody(1,'Where is it?',`<div class="fr-fields">
    ${frField('Address','workstation',"The machine's name on your network or VPN, or its IP address.")}
    ${frField('User','dev')}
    ${frField('Port','22')}
    ${frField('Name','<span style="color:var(--dim)">optional</span>','How kudde lists this machine. Leave it empty to use the address.')}
    </div><p>Tailscale SSH does not work with the phone key: use an address and port where OpenSSH answers.</p>
    ${failed?`<div class="fr-notice"><b style="font-weight:500">No answer from workstation.</b><p>Check that the phone is on the same Wi-Fi or VPN as the machine, and that the address is right.</p></div>`:`<div class="fr-notice"><span>Connecting to workstation…</span><p>Still no answer. This can take 20 seconds.</p></div>`}`),failed?frButton('Try again'):`<button class="btn solid" disabled style="opacity:.38">Continue</button>`);
}
function frManual(theme){
  return frPhone(theme,frBody(2,"This phone's key",`<p>On workstation, signed in as dev, paste this into a terminal and press Enter:</p>
    <pre class="fp fr-command" tabindex="0" aria-label="Setup command">${frEscape(frCommand)}</pre>
    <div class="fr-actions">${frButton('Copy',false)}${frButton('Share',false)}</div>
    <p>Sending it to yourself in a note or a message is fine: nothing in it is secret.</p>
    <p>It adds this phone's key, then prints the machine's host key. With this key, SSH runs only herdr-core: no terminal session, no forwarding. herdr-core can still run commands as that user, so treat the key like a shell login.</p>
    <p>For sh, bash and zsh.</p>
    ${frChoices()}`),frButton('Compare the fingerprint'));
}
function frRefused(theme){
  return frPhone(theme,frBody(2,"This phone's key",`<div class="fr-notice"><b style="font-weight:500">workstation did not accept the phone key.</b><p>Choose how to add it, signed in as dev. If you already ran the command, check that its quotes arrived unchanged, then try again.</p></div>
    ${frChoices(true)}<p>Both ways add only this phone's public key, limited to herdr-core. Existing keys stay in place.</p>`),frButton('Try again')+frButton('Change the address',false));
}
function frConnected(theme){
  return frPhone(theme,frBody(3,'Connected',`<div class="fr-notice"><div style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:var(--a2)"></span><span>workstation is connected.</span></div><p>herdr-core 0.1.16</p></div><p>3 agents are running there.</p>`),frButton('Continue'));
}
function frAlerts(theme,state='received'){
  const missed=state==='missed';
  return frPhone(theme,frBody(4,'Alerts',`<p>kudde can tell you when an agent needs you or has finished, also while the app is closed.</p>
    <p>It needs two things: a UnifiedPush app such as ntfy on this phone, and kudde-push running on workstation. The setup guide shows how to install kudde-push.</p>
    ${frGuide()}
    ${state==='before'?'':`<div class="fr-notice">${missed?`<span>No test alert from workstation within 30 seconds.</span><p>Check that kudde-push runs there; the setup guide shows how.</p>`:`<span style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:var(--a2)"></span>Alerts reach this phone.</span>`}</div>`}`),
    state==='before'?frButton('Turn on alerts')+frButton('Show my agents',false):missed?frButton('Try again')+frButton('Show my agents',false):frButton('Show my agents'));
}
function frTrust(theme){
  const behind=frManual(theme);
  return behind.replace(/(<div class="phone [^"]+">)/,`$1<div class="scrim" style="z-index:1"></div><div class="dialog" style="z-index:2">
    <h3>Trust this machine?</h3>
    <p>First connection to <span style="color:var(--fg)">workstation:22</span>. The command you ran there printed its host key. Trust it only if the fingerprint is the same:</p>
    <div class="fp">ED25519<br>SHA256:q3Vb8m2N4sR7tK0yL9wE1aZ5cX6vB3nM8jH2gF4dS0p</div>
    <p>Not the same? Do not trust it. Something else answered at that address: Tailscale SSH, or another SSH server on that port.</p>
    <p style="font-size:13px">After this, a different key stops the connection.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:4px">${frButton('Cancel',false)}${frButton('Trust and connect')}</div>
  </div>`);
}
function frHome(theme,empty=false){
  return frPhone(theme,empty?`<div class="fr-home-empty"><h2>No machines yet</h2><p>Add a machine that runs herdr-core to see its agents here.</p>${frButton('Set up a machine')}</div>`:`<div class="notice"><span class="ring"></span><span style="flex:1;color:var(--fg)">workstation · finish setup</span>${ico.right}</div>
    <div class="fr-notice" style="margin:12px 16px"><span>workstation is not connected yet</span><p>Its setup is not finished.</p>${frButton('Continue setup',false)}</div>
    <div class="fr-home-empty"><h2>No agents yet</h2>${frButton('New terminal',false)}</div>`,'',agentsTop(!empty));
}

const SCREENS = [
  ['1-home-dark','1 Agent list (graphite)',()=>home('graphite')],
  ['2-home-light','2 Agent list (paper)',()=>home('paper')],
  ['3-terminal-watch','3 Terminal, watching at desk size',watch],
  ['4-terminal-type','4 Terminal, typing at phone size',typing],
  ['4b-terminal-type-hidden','4b Terminal, typing, keyboard hidden',typingHidden],
  ['5-compose','5 Compose',compose],
  ['6-notification','6 Needs-you notification',lockscreen],
  ['7-machines','7 Machines',machines],
  ['8-host-key','8 First connection: host key',hostkey],
  ['9-new-spaces','9 New terminal: spaces, agents found',newSpaces],
  ['10-new-folders','10 New terminal: no spaces, checking agents',newFolders],
  ['11-new-error','11 New terminal: could not start',newError],
  ['12-new-off','12 New, nothing connected',newOff],
  ['13-changes-button','13 Changes button in the title bar (superseded by terminal-map)',changesButton],
  ['14-changes-list-dark','14 Changes list (graphite)',()=>changesList('graphite')],
  ['15-changes-list-light','15 Changes list (paper)',()=>changesList('paper')],
  ['16-changes-diff-dark','16 A diff, wrapped (graphite)',()=>changesDiff('graphite')],
  ['17-changes-diff-light','17 A diff, wrapped (paper)',()=>changesDiff('paper')],
  ['18-changes-long','18 A long diff: Show the whole diff',changesLong],
  ['19-changes-none','19 No changes',()=>changesState('none')],
  ['20-changes-norepo','20 Not a git repository',()=>changesState('norepo')],
  ['21-changes-error','21 Could not read the changes',()=>changesState('error')],
  ['22-changes-kinds','22 Other kinds and the 1,000 cap',changesKinds],
  ['23-changes-notes','23 Texts for the other cases (sheet of examples)',changesSmall],
  ['spaces-dark','Spaces view (graphite)',()=>spaces('graphite')],
  ['spaces-light','Spaces view (paper)',()=>spaces('paper')],
  ['terminal-map','The quieter title bar: tab map, menu, icon switch, gauge (graphite and paper; 412 dp at 130%, 360 dp at 2x)',terminalMap],
  ['tab-overview','Tab overview: tiles, and the row fallback for six panes',tabOverview],
  ['first-run-welcome','First run · Welcome',()=>frBoth([['Welcome',frWelcome]])],
  ['first-run-lock','First run · Screen lock',()=>frBoth([['Before step 1',frLock],['Home after completion',frLockHome]])],
  ['first-run-address','First run · Address',()=>frBoth([['Waiting',frAddress],['No answer (F1)',t=>frAddress(t,true)]])],
  ['first-run-manual','First run · Manual key setup',()=>frBoth([['Manual detail',frManual]])],
  ['first-run-key-refused','First run · Key refused',()=>frBoth([['Key refused',frRefused]])],
  ['first-run-connected','First run · Connected',()=>frBoth([['Connected',frConnected]])],
  ['first-run-alerts','First run · Alerts',()=>frBoth([['Before (AL4)',t=>frAlerts(t,'before')],['Test received (AL6)',t=>frAlerts(t,'received')],['No test alert (AL7)',t=>frAlerts(t,'missed')]])],
  ['first-run-trust','First run · Compare the fingerprint',()=>frBoth([['Trust dialog',frTrust]])],
  ['first-run-home','First run · Home',()=>frBoth([['Finish setup',frHome],['Empty after completion',t=>frHome(t,true)]])],
];
const params = new URLSearchParams(location.search);
const want = params.get('only') || params.get('s');
document.body.className = want ? 'single' : 'gallery';
document.body.insertAdjacentHTML('beforeend', SCREENS.filter(([id])=>!want||id===want).map(([id,label,fn])=>`<section class="frame" id="${id}"><h2>${label}</h2>${fn()}</section>`).join(''));
</script>
